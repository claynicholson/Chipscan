[project]
name = "chipscan"
version = "0.1.0"
description = "Design-referenced optical defect inspection for chips: register giant microscope mosaics to GDS layouts, segment, compare, and report."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.23",
    "opencv-python-headless>=4.9",
    "tifffile>=2024.2",
    "imagecodecs>=2024.1",
    "zarr>=3.0",
    "pyvips>=2.2",
    "pillow>=10.3",
    "gdstk>=0.9.50",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "torch>=2.3",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Reading Olympus .vsi natively needs Bio-Formats (Java). Optional.
vsi = [
    "bioio>=1.0",
    "bioio-bioformats>=1.0",
]

[project.scripts]
chipscan = "chipscan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chipscan"]
include = ["chipscan/web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"chipscan/cli.py" = ["B008"]  # typer.Option in defaults is the typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
